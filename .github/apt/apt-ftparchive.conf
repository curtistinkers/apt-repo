Dir {
	ArchiveDir ".";
	CacheDir "./cache";
};
Default {
	Packages::Compress ". gzip bzip2";
	Sources::Compress ". gzip bzip2";
	Contents::Compress ". gzip bzip2";
};
TreeDefault {
	BinCacheDB "packages-$(DIST)-$(SECTION)-$(ARCH).db";
	# This evaluates dynamically to pool/trixie/main, pool/trixie/contrib, etc.
	Directory "pool/$(DIST)/$(SECTION)/";
	Packages "dists/$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
	SrcDirectory "pool/$(DIST)/$(SECTION)";
	Sources "dists/$(DIST)/$(SECTION)/source/Sources";
	Contents "dists/$(DIST)/Contents-$(ARCH)";
};
# =========================================================================
# DEBIAN PRODUCTION TARGETS
# =========================================================================
Tree "bookworm" {
	Sections "main non-free"; # Links strictly to pool/bookworm/{main,non-free}
	Architectures "amd64 all source";
}

Tree "trixie" {
	Sections "main non-free"; # Links strictly to pool/trixie/{main,non-free}
	Architectures "amd64 all source";
}

# =========================================================================
# PROXMOX PRODUCTION TARGETS
# =========================================================================
Tree "pve8" {
	Sections "main non-free"; # Links strictly to pool/pve8/{main,non-free}
	Architectures "amd64 all source";
}

Tree "pve9" {
	Sections "main non-free"; # Links strictly to pool/pve9/{main,non-free}
	Architectures "amd64 all source";
}
