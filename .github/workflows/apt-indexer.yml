name: Deploy Branch to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions to allow publishing to GitHub Pages
permissions:
  contents: read     # Only reading files for deployment in this basic step
  pages: write       # Required to stream artifacts to GitHub Pages
  id-token: write    # Required for secure OIDC token deployment validation

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued.  However, do NOT cancel in-progress runs as
# we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint:
    name: Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Branch Codebase
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Run Actionlint Workflow Validator
        uses: raven-actions/actionlint@v2

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Deploy Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ # Uploads the root of gh-pages branch (including external packages)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
