name: Matrix Indexer

on:
  workflow_dispatch:

env:
  REPO_DISTS: '["bookworm", "trixie", "pve8", "pve9"]'  # Array string for Job 1's matrix strategy
  REPO_SECTIONS: '["main", "non-free"]'                 # Array string for Job 1's matrix strategy
  REPO_ARCHITECTURES: '["all", "amd64"]'                # Array string for Job 1's matrix strategy

jobs:
  # =========================================================================
  # JOB 0: BOOTSTRAP ENVIRONMENT CALCULATOR
  # =========================================================================
  bootstrap:
    name: Initialize Pipeline Context
    runs-on: ubuntu-latest
    outputs:
      # Saves the configurations as job outputs accessible inside matrix strategies
      dists: ${{ steps.export-vars.outputs.dists }}
      sections: ${{ steps.export-vars.outputs.sections }}
      architectures: ${{ steps.export-vars.outputs.architectures }}

      components: ${{ steps.export-vars.outputs.components }}
    steps:
      - name: Export Environment Variables
        id: export-vars
        run: |
          echo "Processing global arrays for matrix injection..."
          # FIXED: Single quotes preserve the inner double-quotes in your JSON string array maps
          echo 'dists=${{ env.REPO_DISTS }}' >> "$GITHUB_OUTPUT"
          echo 'sections=${{ env.REPO_SECTIONS }}' >> "$GITHUB_OUTPUT"
          echo 'architectures=${{ env.REPO_ARCHITECTURES }}' >> "$GITHUB_OUTPUT"
          
          # Use built-in jq to instantly generate the space-separated string companion
          COMPONENTS=$(echo '${{ env.REPO_SECTIONS }}' | jq -r '. | join(" ")')
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 1: NATIVE 16-WAY ATOMIC PARALLEL MATRIX PACKAGE COMPILATION
  # =========================================================================
  build-packages:
    name: Compile ${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: bootstrap
    strategy:
      matrix:
        # Inherits array from top-level global settings natively
        dist: ${{ fromJson(needs.bootstrap.outputs.dists) }}
        section: ${{ fromJson(needs.bootstrap.outputs.sections) }}
        arch:  ${{ fromJson(needs.bootstrap.outputs.architectures) }}
    steps:
      - name: Check for Cached Package Files
        id: cache-deb
        uses: actions/cache@v4
        with:
          path: pool/${{ matrix.dist }}/${{ matrix.section }}/
          # The key binds explicitly to this precise matrix slot coordination
          key: deb-cache-${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}

      - name: Initialize Component Pool Target Directory
        run: mkdir -p "pool/${{ matrix.dist }}/${{ matrix.section }}"

      - name: Compile Single Atomic Package Variation
        run: |
          # Dynamically lock down version numbers based on matrix coordinates
          [ "${{ matrix.arch }}" = "all" ] && [ "${{ matrix.section }}" = "main" ] && VERSION="1.0"
          [ "${{ matrix.arch }}" = "amd64" ] && [ "${{ matrix.section }}" = "main" ] && VERSION="2.0"
          [ "${{ matrix.arch }}" = "all" ] && [ "${{ matrix.section }}" = "non-free" ] && VERSION="3.0"
          [ "${{ matrix.arch }}" = "amd64" ] && [ "${{ matrix.section }}" = "non-free" ] && VERSION="4.0"

          # Sandbox the build workspace to prevent file collisions
          WORKSPACE_DIR="/tmp/${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}"

          export DIST="${{ matrix.dist }}"

          # 1. Determine pretty name from distro machine name.
          if [[ "${DIST}" == pve* ]]; then
            # Capitalizes the 'pve' string prefix cleanly to Proxmox VE
            export PRETTY_NAME="Proxmox VE ${DIST#pve}"
          else
            # Capitalizes the first letter of the Debian codename on the fly
            export PRETTY_NAME="Debian ${DIST^}"
          fi

           mkdir -p "${WORKSPACE_DIR}/DEBIAN"

          cat << EOF > "${WORKSPACE_DIR}/DEBIAN/control"
          Package: ${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}-test
          Version: ${VERSION}
          Architecture: ${{ matrix.arch }}
          Maintainer: curtistinkers
          Description: A ${{ matrix.section }} ${{ matrix.arch }} test package for ${PRETTY_NAME}.
          EOF

          # Build directly into the precise folder track matching our layout
          dpkg-deb --build "${WORKSPACE_DIR}" "pool/${{ matrix.dist }}/${{ matrix.section }}/${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}-test_${VERSION}_${{ matrix.arch }}.deb"

      - name: Stash Isolated Package Asset
        uses: actions/upload-artifact@v4
        with:
          # Unique named key system preserves all 16 tracks perfectly
          name: package-${{ matrix.dist }}-${{ matrix.section }}-${{ matrix.arch }}
          path: pool/

  # =========================================================================
  # JOB 2: PARALLEL INDEX GENERATION & SECURE CRYPTOGRAPHIC GPG SIGNING
  # =========================================================================
  index-and-sign:
    name: Generate & Sign APT Repo for ${{ matrix.dist }}
    runs-on: ubuntu-latest
    needs: [bootstrap, build-packages]
    strategy:
      matrix:
        # Multiplies into 4 simultaneous parallel builder runners
        dist: [bookworm, trixie, pve8, pve9]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Specific Package Suite Pools
        uses: actions/download-artifact@v4
        with:
          pattern: package-${{ matrix.dist }}-*
          path: pool/
          merge-multiple: true

      - name: Provision Apt Indexing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          mkdir -p cache

      - name: Initialize Suite Distribution Directories
        run: |
          for COMPONENT in ${{ needs.bootstrap.outputs.components }}; do
            for TYPE in binary-all binary-amd64 source; do
              mkdir -p "dists/${{ matrix.dist }}/${COMPONENT}/${TYPE}"
            done
          done

      - name: Run apt-ftparchive Index Scan
        run: apt-ftparchive generate .github/apt/apt-ftparchive.conf

      - name: Generate Suite Release Manifest Natively via Template
        run: |
          echo "Rendering dynamic metadata header profile for: ${{ matrix.dist }}"
          
          export DIST="${{ matrix.dist }}"
          export COMPONENTS="${{ needs.bootstrap.outputs.components }}"

          # 1. Determine pretty name from distro machine name.
          if [[ "${DIST}" == pve* ]]; then
            # Capitalizes the 'pve' string prefix cleanly to Proxmox VE
            export PRETTY_NAME="Proxmox VE ${DIST#pve}"
          else
            # Capitalizes the first letter of the Debian codename on the fly
            export PRETTY_NAME="Debian ${DIST^}"
          fi
        
          # 2. Inject environment attributes directly into your new single template file
          # and save it as a temporary live configuration file for this specific matrix runner
          envsubst < .github/apt/release.conf.template > .github/apt/${{ matrix.dist }}-release.conf
          
          # 3. Execute apt-ftparchive using the freshly compiled dynamic configuration file
          apt-ftparchive -c ".github/apt/${{ matrix.dist }}-release.conf" release "dists/${{ matrix.dist }}" > "dists/${{ matrix.dist }}/Release"

      - name: Import GPG Cryptographic Key Ring
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cryptographically Lock Target Release Manifest
        run: |
          echo "Signing suite release manifests for target: ${{ matrix.dist }}"
          rm -f "dists/${{ matrix.dist }}/InRelease" "dists/${{ matrix.dist }}/Release.gpg"
          
          # Generates inline clearsigned signature wrapper natively
          gpg --batch --yes --clearsign --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user "${{ steps.import-gpg.outputs.keyid }}" \
            --output "dists/${{ matrix.dist }}/InRelease" "dists/${{ matrix.dist }}/Release"
            
          # Generates detached binary signature token
          gpg --batch --yes --detach-sign --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user "${{ steps.import-gpg.outputs.keyid }}" \
            --output "dists/${{ matrix.dist }}/Release.gpg" "dists/${{ matrix.dist }}/Release"

      - name: Verify Authentic Signature Output Status
        run: gpg --verify "dists/${{ matrix.dist }}/InRelease"

      - name: Stash Signed Metadata Indexes
        uses: actions/upload-artifact@v4
        with:
          name: indexes-${{ matrix.dist }}
          path: dists/

  # =========================================================================
  # JOB 3: COLLECT MATRIX ASSETS AND COMPILE WEB PLATFORM LAST
  # =========================================================================
  build-jekyll:
    name: Compile Final Jekyll Layouts
    runs-on: ubuntu-latest
    needs: [bootstrap, build-packages, index-and-sign]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Re-instate Complete Package Pools
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: pool/
          merge-multiple: true

      - name: Re-instate All Signed Repository Indexes
        uses: actions/download-artifact@v4
        with:
          pattern: indexes-*
          path: dists/
          merge-multiple: true

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Compile Automated Jekyll Package Data
        run: |
          mkdir -p _data
          echo "packages:" > _data/packages.yml
          if [ -d "pool" ]; then
            find pool/ -name "*.deb" | sort | while read -r deb; do
              echo "Extracting package attributes from: $deb" >&2
              pkg_name=$(dpkg-deb -f "$deb" Package)
              pkg_ver=$(dpkg-deb -f "$deb" Version)
              pkg_desc=$(dpkg-deb -f "$deb" Description | head -n 1)
              pkg_suite=$(echo "$deb" | cut -d'/' -f2)
              pkg_comp=$(echo "$deb" | cut -d'/' -f3)
              pkg_file=$(basename "$deb")
              
              echo "  - name: \"$pkg_name\""
              echo "    version: \"$pkg_ver\""
              echo "    suite: \"$pkg_suite\""
              echo "    component: \"$pkg_comp\""
              echo "    file: \"$pkg_file\""
              echo "    description: \"$pkg_desc\""
            done >> _data/packages.yml
          else
            echo "Pool directory not found. Skipping data generation."
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Flatten Web Assets to Workspace Root
        run: |
          echo "Unpacking compiled layouts to the root directory..."
          cp -r _site/* ./
  
      - name: Modify Web Assets for Local Offline Previewing
        run: |
          echo "Converting root-relative paths to local file-relative tracks..."
          find . -maxdepth 1 -type f -name "*.html" -exec sed -i 's|href="/|href="./|g' {} \;
          find . -maxdepth 1 -type f -name "*.html" -exec sed -i 's|src="/|src="./|g' {} \;

      - name: Archive Finalized System Package Layout Tree
        uses: actions/upload-artifact@v4
        with:
          name: finalized-apt-repository-layout
          path: |
            dists/
            pool/
            *.html
            assets/
