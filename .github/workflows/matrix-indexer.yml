name: Matrix Indexer

on:
  workflow_dispatch:

env:
  REPO_SUITES: '["bookworm", "trixie", "pve8", "pve9", "resolute", "noble", "focal"]'  # Array string for Job 1's matrix strategy
  REPO_COMPONENTS: '["main", "non-free"]'                 # Array string for Job 1's matrix strategy
  REPO_ARCHITECTURES: '["all", "amd64"]'                # Array string for Job 1's matrix strategy

jobs:
  # =========================================================================
  # JOB 0: BOOTSTRAP ENVIRONMENT CALCULATOR
  # =========================================================================
  bootstrap:
    name: Initialize Pipeline Context
    runs-on: ubuntu-latest
    outputs:
      # Saves the configurations as job outputs accessible inside matrix strategies
      suites: ${{ steps.export-vars.outputs.suites }}
      components: ${{ steps.export-vars.outputs.components }}
      architectures: ${{ steps.export-vars.outputs.architectures }}

      components_string: ${{ steps.export-vars.outputs.components_string }}
      architectures_string: ${{ steps.export-vars.outputs.architectures_string }}
    steps:
      - name: Export Environment Variables
        id: export-vars
        run: |
          # Extracts sections array to plain space-separated text string
          COMPONENTS_STRING=$(echo '${{ env.REPO_COMPONENTS }}' | jq -r '. | join(" ")')

          # Extracts architecture array and appends "source" to match your template spec
          ARCHITECTURES_STRING=$(echo '${{ env.REPO_ARCHITECTURES }}' | jq -r '. | join(" ")')

          # Send all context into the output at once
          {
            echo 'suites=${{ env.REPO_SUITES }}'
            echo 'components=${{ env.REPO_COMPONENTS }}'
            echo 'architectures=${{ env.REPO_ARCHITECTURES }}'
            echo "components_string=${COMPONENTS_STRING}"
            echo "architectures_string=${ARCHITECTURES_STRING} source"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 1: ATOMIC PARALLEL MATRIX PACKAGE COMPILATION
  # =========================================================================
  build-packages:
    name: Build ${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }} Test Package
    runs-on: ubuntu-latest
    needs: bootstrap
    strategy:
      matrix:
        # Inherits array from top-level global settings natively
        suite: ${{ fromJson(needs.bootstrap.outputs.suites) }}
        component: ${{ fromJson(needs.bootstrap.outputs.components) }}
        architecture:  ${{ fromJson(needs.bootstrap.outputs.architectures) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for Cached Package Files
        id: cache-deb
        uses: actions/cache@v4
        with:
          path: pool/${{ matrix.suite }}/${{ matrix.component }}/
          # The key binds explicitly to this precise matrix slot coordination
          key: deb-cache-${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }}
      
      - name: Determine Pretty Name
        run: |
          chmod +x .github/apt/scripts/get-pretty-name.sh
          SUITE_NAME=$(.github/apt/scripts/get-pretty-name.sh "${{ matrix.suite }}" '${{ env.REPO_SUITES }}')
          echo "SUITE_PRETTY_NAME=${SUITE_NAME}" >> "${GITHUB_ENV}"

      - name: Determine Version Number
        run: |
          # Use an explicit if/elif/else structure so the script always exits successfully with 0
          if [ "${{ matrix.architecture }}" = "all" ] && [ "${{ matrix.component }}" = "main" ]; then
            TARGET_VERSION="1.0"
          elif [ "${{ matrix.architecture }}" = "amd64" ] && [ "${{ matrix.component }}" = "main" ]; then
            TARGET_VERSION="2.0"
          elif [ "${{ matrix.architecture }}" = "all" ] && [ "${{ matrix.component }}" = "non-free" ]; then
            TARGET_VERSION="3.0"
          elif [ "${{ matrix.architecture }}" = "amd64" ] && [ "${{ matrix.component }}" = "non-free" ]; then
            TARGET_VERSION="4.0"
          else
            TARGET_VERSION="0.1"
          fi
          echo "VERSION=${TARGET_VERSION}" >> "${GITHUB_ENV}"

      - name: Create Pool Directory
        run: mkdir -p "pool/${{ matrix.suite }}/${{ matrix.component }}"

      - name: Create Workspace Directory
        run: |
          TARGET_WORKSPACE="/tmp/${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }}"
          echo "WORKSPACE_DIR=${TARGET_WORKSPACE}" >> "${GITHUB_ENV}"
          mkdir -p "${TARGET_WORKSPACE}/DEBIAN"

      - name: Create Package control File
        run: |
          cat << EOF > "${WORKSPACE_DIR}/DEBIAN/control"
          Package: ${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }}-test
          Version: ${VERSION}
          Architecture: ${{ matrix.architecture }}
          Maintainer: curtistinkers
          Description: A ${{ matrix.component }} ${{ matrix.architecture }} test package for ${SUITE_PRETTY_NAME}.
          EOF 

      - name: Build Package Asset
        run: dpkg-deb --build "${WORKSPACE_DIR}" "pool/${{ matrix.suite }}/${{ matrix.component }}/${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }}-test_${VERSION}_${{ matrix.architecture }}.deb"

      - name: Stash Package Asset
        uses: actions/upload-artifact@v4
        with:
          # Unique named key system preserves all 16 tracks perfectly
          name: package-${{ matrix.suite }}-${{ matrix.component }}-${{ matrix.architecture }}
          path: pool/

  # =========================================================================
  # JOB 2: PARALLEL INDEX GENERATION
  # =========================================================================
  index-repository:
    name: Generate Plaintext Repository Index for ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: [bootstrap, build-packages]
    strategy:
      matrix:
        # Multiplies into 4 simultaneous parallel builder runners
        suite: ${{ fromJson(needs.bootstrap.outputs.suites) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Package Pools
        uses: actions/download-artifact@v4
        with:
          pattern: package-${{ matrix.suite }}-*
          path: pool/
          merge-multiple: true

      - name: Install Apt Indexing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Determine Pretty Name
        run: |
          chmod +x .github/apt/scripts/get-pretty-name.sh
          SUITE_NAME=$(.github/apt/scripts/get-pretty-name.sh "${{ matrix.suite }}" '${{ env.REPO_SUITES }}')
          echo "SUITE_PRETTY_NAME=${SUITE_NAME}" >> "${GITHUB_ENV}"

      - name: Create apt-ftparchive Cache Directory
        run: mkdir -p cache

      - name: Create Distribution Directory
        run: |
          # Loop through your sections dynamically from bootstrap outputs
          for SECTION in ${{ needs.bootstrap.outputs.components_string }}; do
            # Loop through your architectures dynamically
            for ARCHITECTURE in $(echo '${{ env.REPO_ARCHITECTURES }}' | jq -r '. | join(" ")'); do
              echo "Creating directory: dists/${{ matrix.suite }}/${SECTION}/binary-${ARCHITECTURE}"
              mkdir -p "dists/${{ matrix.suite }}/${SECTION}/binary-${ARCHITECTURE}"
            done
            # Always append the pristine source folder track per component section
            echo "Creating directory: dists/${{ matrix.suite }}/${SECTION}/source"
            mkdir -p "dists/${{ matrix.suite }}/${SECTION}/source"
          done

      - name: Generate apt-ftparchive Configuration File
        run: |
          export SUITE="${{ matrix.suite }}"
          export COMPONENTS="${{ needs.bootstrap.outputs.components_string }}"
          export ARCHITECTURES="${{ needs.bootstrap.outputs.architectures_string }}"
          envsubst < .github/apt/apt-ftparchive.conf.template > .github/apt/apt-ftparchive-${{ matrix.suite }}.conf
          cat .github/apt/apt-ftparchive-${{ matrix.suite }}.conf

      - name: Run apt-ftparchive Index Scan
        run: apt-ftparchive generate .github/apt/apt-ftparchive-${{ matrix.suite }}.conf

      - name: Generate Release Manifest File
        run: |
          export SUITE="${{ matrix.suite }}"
          export COMPONENTS="${{ needs.bootstrap.outputs.components_string }}"
          export ARCHITECTURES="${{ needs.bootstrap.outputs.architectures_string }}"
          envsubst < .github/apt/release.conf.template > .github/apt/${{ matrix.suite }}-release.conf

      - name: Run apt-ftparchive Manifest Generation
        run: apt-ftparchive -c ".github/apt/${{ matrix.suite }}-release.conf" release "dists/${{ matrix.suite }}" > "dists/${{ matrix.suite }}/Release"

      - name: Stash Plaintext Metadata Indexes
        uses: actions/upload-artifact@v4
        with:
          name: indexes-${{ matrix.suite }}
          path: dists/

  # =========================================================================
  # JOB 3: SECURE CRYPTOGRAPHIC GPG SIGNING BLOCK
  # =========================================================================
  sign-repository:
    name: Signed Repository Index for ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: [bootstrap, index-repository] # Waits for Job 2 to finish generating text files
    strategy:
      matrix:
        suite: ${{ fromJson(needs.bootstrap.outputs.suites) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Package Pools
        uses: actions/download-artifact@v4
        with:
          pattern: indexes-${{ matrix.suite }}
          path: dists/
          merge-multiple: true

      - name: Import GPG Key Ring
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Release Manifest File
        run: |
          echo "Signing suite release manifests for target: ${{ matrix.suite }}"
          rm -f "dists/${{ matrix.suite }}/InRelease" "dists/${{ matrix.suite }}/Release.gpg"
          
          # Generates inline clearsigned signature wrapper natively
          gpg --batch --yes --clearsign --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user "${{ steps.import-gpg.outputs.keyid }}" \
            --output "dists/${{ matrix.suite }}/InRelease" "dists/${{ matrix.suite }}/Release"
            
          # Generates detached binary signature token
          gpg --batch --yes --detach-sign --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user "${{ steps.import-gpg.outputs.keyid }}" \
            --output "dists/${{ matrix.suite }}/Release.gpg" "dists/${{ matrix.suite }}/Release"

      - name: Verify Release Manifest Signature
        run: |
          echo "${{ steps.import-gpg.outputs.fingerprint }}:6:" | gpg --batch --yes --import-ownertrust
          gpg --keyring ./assets/keyrings/curtistinkers-archive-keyring.gpg \
              --verify "dists/${{ matrix.suite }}/InRelease"

      - name: Stash Signed Repository Index
        uses: actions/upload-artifact@v4
        with:
          name: signed-indexes-${{ matrix.suite }}
          path: dists/

  # =========================================================================
  # JOB 3: COLLECT MATRIX ASSETS AND COMPILE WEB PLATFORM LAST
  # =========================================================================
  build-jekyll:
    name: Compile Final Jekyll Layouts
    runs-on: ubuntu-latest
    needs: [bootstrap, build-packages, index-repository, sign-repository]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Retrieve All Package Pools
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: pool/
          merge-multiple: true

      - name: Retrieve All Signed Repository Indexes
        uses: actions/download-artifact@v4
        with:
          pattern: signed-indexes-*
          path: dists/
          merge-multiple: true

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Compile Package Data for Jekyll
        run: |
          mkdir -p _data
          echo "packages:" > _data/packages.yml
          if [ -d "pool" ]; then
            find pool/ -name "*.deb" | sort | while read -r deb; do
              echo "Extracting package attributes from: $deb" >&2
              pkg_name=$(dpkg-deb -f "$deb" Package)
              pkg_ver=$(dpkg-deb -f "$deb" Version)
              pkg_desc=$(dpkg-deb -f "$deb" Description | head -n 1)
              pkg_suite=$(echo "$deb" | cut -d'/' -f2)
              pkg_comp=$(echo "$deb" | cut -d'/' -f3)
              pkg_file=$(basename "$deb")
              
              echo "  - name: \"$pkg_name\""
              echo "    version: \"$pkg_ver\""
              echo "    suite: \"$pkg_suite\""
              echo "    component: \"$pkg_comp\""
              echo "    file: \"$pkg_file\""
              echo "    description: \"$pkg_desc\""
            done >> _data/packages.yml
          else
            echo "Pool directory not found. Skipping data generation."
          fi

      - name: Build Pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Flatten Web Assets to Workspace Root
        run: |
          echo "Unpacking compiled layouts to the root directory..."
          cp -r _site/* ./
  
      - name: Modify Web Assets for Local Offline Previewing
        run: |
          echo "Converting root-relative paths to local file-relative tracks..."
          find . -maxdepth 1 -type f -name "*.html" -exec sed -i 's|href="/|href="./|g' {} \;
          find . -maxdepth 1 -type f -name "*.html" -exec sed -i 's|src="/|src="./|g' {} \;

      - name: Archive Finalized System Package Layout Tree
        uses: actions/upload-artifact@v4
        with:
          name: finalized-apt-repository-layout
          path: |
            dists/
            pool/
            *.html
            assets/
            /packages/
