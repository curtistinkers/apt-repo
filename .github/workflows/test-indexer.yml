          EOF
          dpkg-deb --build /tmp/${DIST}-${SECTION}-${ARCH} pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb

      - name: Compile Automated Jekyll Package Data Directory
        run: |
          echo "Initializing website metadata generation loop..."
          mkdir -p _data
          echo "packages:" > _data/packages.yml
          
          # Recursively find every real valid compiled package file inside your pool/ tree
          if [ -d "pool" ]; then
            find pool/ -name "*.deb" | sort | while read -r deb; do
              echo "Extracting telemetry attributes from: $deb"
              
              # Parse the internal control headers using standard system dpkg utilities
              pkg_name=$(dpkg-deb -f "$deb" Package)
              pkg_ver=$(dpkg-deb -f "$deb" Version)
              pkg_desc=$(dpkg-deb -f "$deb" Description | head -n 1)
              
              # Determine the target distribution and component directly from the folder layout path
              # Example: pool/trixie/main/... -> suite = trixie, component = main
              pkg_suite=$(echo "$deb" | cut -d'/' -f2)
              pkg_comp=$(echo "$deb" | cut -d'/' -f3)
              
              # Append the metadata block with strict indentation formatting into the Jekyll database
              echo "  - name: \"$pkg_name\"" >> _data/packages.yml
              echo "    version: \"$pkg_ver\"" >> _data/packages.yml
              echo "    suite: \"$pkg_suite\"" >> _data/packages.yml
              echo "    component: \"$pkg_comp\"" >> _data/packages.yml
              echo "    description: \"$pkg_desc\"" >> _data/packages.yml
            done
          else
            echo "Pool directory not found. Skipping data generation."
          fi

      - name: Output Generated Jekyll YAML Database for Review
        run: |
          if [ -f "_data/packages.yml" ]; then
            cat _data/packages.yml
          else
            echo "Jekyll database file was not written."
          fi

      - name: Generate apt-ftparchive
        run: apt-ftparchive generate .github/apt/apt-ftparchive.conf

      - name: Index Debian Trixie Packages
        run: apt-ftparchive -c .github/apt/trixie-release.conf release dists/trixie > dists/trixie/Release

      - name: Index Debian Bookworm Packages
        run: apt-ftparchive -c .github/apt/bookworm-release.conf release dists/bookworm > dists/bookworm/Release

      - name: Index Proxmox VE 9 Packages
        run: apt-ftparchive -c .github/apt/pve9-release.conf release dists/pve9 > dists/pve9/Release

      - name: Index Proxmox VE 8 Packages
        run: apt-ftparchive -c .github/apt/pve8-release.conf release dists/pve8 > dists/pve8/Release

      - name: Verify Generated Package Layout Structure
        run: |
          echo "=== Group A: Verification of Physical .deb Files on Disk ==="
          find pool/ -type f -name "*.deb"
          
          echo "=== Group B: Inspecting Non-Zero Packages Text Index Outputs ==="
          find dists/ -type f -name "Packages" -exec echo "--- File: {} ---" \; -exec cat {} \;
  
      - name: Output Generated Trixie Release Manifest File for Review
        run: cat dists/trixie/Release

      - name: Output Generated Proxmox VE 9 Release Manifest File for Review
        run: cat dists/pve9/Release

      - name: Output Generated Bookworm Release Manifest File for Review
        run: cat dists/bookworm/Release

      - name: Output Generated Proxmox VE 8 Release Manifest File for Review
        run: cat dists/pve8/Release

      - name: Archive Test Index Output Tree
        uses: actions/upload-artifact@v4
        with:
          name: test-apt-repository-layout
          path: .
