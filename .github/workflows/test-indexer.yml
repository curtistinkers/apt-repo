name: TEST REPO INDEXER

on:
  workflow_dispatch:

jobs:
  build-packages:
    name: Create Test Packages
    runs-on: ubuntu-latest
    steps:
      - name: Create Test Packages
        run: |
          for DIST in bookworm trixie pve8 pve9; do
            for SECTION in main non-free; do

              echo "Creating directory: pool/${DIST}/${SECTION}"
              mkdir -p "pool/${DIST}/${SECTION}"

              for ARCH in all amd64; do
                # Determine matching version increments for tracking verification
                [ "${ARCH}" = "all" ] && [ "${SECTION}" = "main" ] && VERSION="1.0"
                [ "${ARCH}" = "amd64" ] && [ "${SECTION}" = "main" ] && VERSION="2.0"
                [ "${ARCH}" = "all" ] && [ "${SECTION}" = "non-free" ] && VERSION="3.0"
                [ "${ARCH}" = "amd64" ] && [ "${SECTION}" = "non-free" ] && VERSION="4.0"

                mkdir -p "/tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN"
                cat << EOF > "/tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN/control"
          Package: ${DIST}-${SECTION}-${ARCH}-test
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: curtistinkers
          Description: A ${SECTION} ${ARCH} test package for ${DIST^}.
          EOF
                echo "Creating package: ${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb"
                dpkg-deb --build "/tmp/${DIST}-${SECTION}-${ARCH}" "pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb"
              done
            done
          done

      - name: Stash Package Tree
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-pool-packages
          path: pool/
  
  build-jekyll:
    name: Compile Staging Jekyll Pages
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Re-instate Package Pools
        uses: actions/download-artifact@v4
        with:
          name: intermediate-pool-packages
          path: pool/

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Compile Automated Jekyll Package Data
        run: |
          mkdir -p _data

          echo "Creating file: _data/packages.yml"

          echo "packages:" > _data/packages.yml
          
          find pool/ -name "*.deb" | sort | while read -r deb; do
            echo "Extracting package attributes from: $deb" >&2
            pkg_name=$(dpkg-deb -f "$deb" Package)
            pkg_ver=$(dpkg-deb -f "$deb" Version)
            pkg_desc=$(dpkg-deb -f "$deb" Description | head -n 1)
            pkg_suite=$(echo "$deb" | cut -d'/' -f2)
            pkg_comp=$(echo "$deb" | cut -d'/' -f3)
            pkg_file=$(basename "$deb")
            
            echo "  - name: \"$pkg_name\""
            echo "    version: \"$pkg_ver\""
            echo "    suite: \"$pkg_suite\""
            echo "    component: \"$pkg_comp\""
            echo "    file: \"$pkg_file\""
            echo "    description: \"$pkg_desc\""
          done >> _data/packages.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Transfer Web Assets to Test Subdirectory
        run: |
          mkdir -p static
          cp -r _site/* static/
          find static/ -type f -name "*.html" -exec sed -i 's|href="/|href="./|g' {} \;
          find static/ -type f -name "*.html" -exec sed -i 's|src="/|src="./|g' {} \;

      - name: Stash Static Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-static-web
          path: static/

  index-and-sign:
    name: Generate APT Repositories
    runs-on: ubuntu-latest
    needs: [build-packages, build-jekyll]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Package Tree
        uses: actions/download-artifact@v4
        with:
          name: intermediate-pool-packages
          path: pool/

      - name: Restore Static Web Assets
        uses: actions/download-artifact@v4
        with:
          name: intermediate-static-web
          path: static/

      - name: Provision Debian Indexing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          mkdir -p cache

      - name: Initialize Suite Distribution Directories
        run: |
          for DIST in bookworm trixie pve8 pve9; do
            for SECTION in main non-free; do
              for COMPONENT in binary-all binary-amd64 source; do
                echo "Creating directory: dists/${DIST}/${SECTION}/${COMPONENT}"
                mkdir -p "dists/${DIST}/${SECTION}/${COMPONENT}"
              done
            done
          done

      - name: Run apt-ftparchive Multi-Suite Index Scan
        run: apt-ftparchive generate .github/apt/apt-ftparchive.conf

      - name: Generate Suite Release Manifests
        run: |
          for DIST in bookworm trixie pve8 pve9; do
            apt-ftparchive -c ".github/apt/${DIST}-release.conf" release "dists/${DIST}" > "dists/${DIST}/Release"
          done

      # - name: Import GPG Cryptographic Key Ring
      #   id: import-gpg
      #   uses: crazy-max/ghaction-import-gpg@v6
      #   with:
      #     gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      #     passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # - name: Sign All Target Repositories
      #   run: |
      #     for DIST in bookworm trixie pve8 pve9; do
      #       rm -f "dists/${DIST}/InRelease" "dists/${DIST}/Release.gpg"
            
      #       gpg --batch --yes --clearsign --pinentry-mode loopback \
      #         --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
      #         --local-user "${{ steps.import-gpg.outputs.keyid }}" \
      #         --output "dists/${DIST}/InRelease" "dists/${DIST}/Release"
              
      #       gpg --batch --yes --detach-sign --pinentry-mode loopback \
      #         --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
      #         --local-user "${{ steps.import-gpg.outputs.keyid }}" \
      #         --output "dists/${DIST}/Release.gpg" "dists/${DIST}/Release"
      #     done

      - name: Output Release Validation Maps for Verification
        run: |
          for DIST in bookworm trixie pve8 pve9; do
            echo "${DIST^^} RELEASE MAP"
            cat dist/${DIST}/Release
          done

      - name: Archive Completed System Package Layout Tree
        uses: actions/upload-artifact@v4
        with:
          name: finalized-apt-repository-layout
          path: |
            dists/
            pool/
            static/
