name: TEST REPO INDEXER

on:
  workflow_dispatch:

jobs:
  test-index:
    name: Dry Run apt-ftparchive Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cache Core Bootstrap Packages
        id: cache-bootstrap
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-test-indexer-bootstrap

      - name: Update System Repositories
        run: sudo apt-get update

      - name: Install apt-utils Utilities
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Initialize Dummy Package Pools
        run: |
          mkdir -p dists/{trixie,pve9}/main/{binary-all,binary-amd64,source}
          mkdir -p pool/main
          mkdir -p cache

      - name: Create Real Valid Debian Trixie Packages
        run: |
          echo "Building authentic minimal Trixie universal configuration package..."
          mkdir -p /tmp/universal/DEBIAN
          cat << 'EOF' > /tmp/universal/DEBIAN/control
          Package: test-trixie-universal-config
          Version: 1.0
          Architecture: all
          Maintainer: curtistinkers
          Description: A real valid universal configuration package layout
          EOF
          dpkg-deb --build /tmp/universal pool/main/test-trixie-universal-config_1.0_all.deb

          echo "Building authentic minimal Trixie amd64 compiled tool package..."
          mkdir -p /tmp/amd64/DEBIAN
          cat << 'EOF' > /tmp/amd64/DEBIAN/control
          Package: test-trixie-amd64-package
          Version: 1.0
          Architecture: amd64
          Maintainer: curtistinkers
          Description: A real valid compiled amd64 target tool layout
          EOF
          dpkg-deb --build /tmp/amd64 pool/main/test-trixie-amd64-package_1.0_amd64.deb

      - name: Create Real Valid Proxmox VE 9 Packages
        run: |
          echo "Building authentic minimal Proxmox universal configuration package..."
          mkdir -p /tmp/universal/DEBIAN
          cat << 'EOF' > /tmp/universal/DEBIAN/control
          Package: test-trixie-universal-config
          Version: 1.0
          Architecture: all
          Maintainer: curtistinkers
          Description: A real valid universal configuration package layout
          EOF
          dpkg-deb --build /tmp/universal pool/main/test-pve9-universal-config_1.0_all.deb

          echo "Building authentic minimal Proxmox tool package..."
          mkdir -p /tmp/pve/DEBIAN
          cat << 'EOF' > /tmp/pve/DEBIAN/control
          Package: test-pve9-tool
          Version: 1.0
          Architecture: amd64
          Maintainer: curtistinkers
          Description: A real valid specialized Proxmox compiled utility
          EOF
          dpkg-deb --build /tmp/pve pool/main/test-pve9-tool_1.0_amd64.deb
      
      - name: Generate apt-ftparchive
        run: |
          apt-ftparchive generate .github/apt/apt-ftparchive.conf

      - name: Index Debian Trixie Test Packages
        run: |
          apt-ftparchive -c .github/apt/trixie-release.conf release dists/trixie > dists/trixie/Release

      - name: Index Proxmox VE 9 Test Packages
        run: |
          apt-ftparchive -c .github/apt/pve9-release.conf release dists/pve9 > dists/pve9/Release

      - name: Output Generated Trixie Release Manifest File for Review
        run: cat dists/trixie/Release

      - name: Output Generated Proxmox VE 9 Release Manifest File for Review
        run: cat dists/pve9/Release

      - name: Archive Test Index Output Tree
        uses: actions/upload-artifact@v4
        with:
          name: test-apt-repository-layout
          path: dists/
