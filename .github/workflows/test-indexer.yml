name: TEST REPO INDEXER

on:
  workflow_dispatch:

jobs:
  test-index:
    name: Run Dry Run apt-ftparchive Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Update System Repositories
        run: sudo apt-get update

      - name: Install apt-utils Utilities
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Initialize Dummy Package Pools
        run: |
          mkdir -p dists/{trixie,pve9}/main/{binary-all,binary-amd64,source}
          mkdir -p pool/main
          # mkdir -p cache

      - name: Create Test Debian Trixie Package Artifacts
        run: |
          echo "Simulating Trixie package indexing environment..."
          # This creates a zero-byte empty text file ending in .deb so apt-ftparchive has something to evaluate
          touch pool/trixie/main/test-trixie-universal-config_1.0_all.deb
          touch pool/trixie/main/test-trixie-amd64-config_1.0_amd64.deb

      - name: Create Test Proxmox VE 9 Package Artifacts
        run: |
          echo "Simulating Proxmox VE 9 package indexing environment..."
          # This creates a zero-byte empty text file ending in .deb so apt-ftparchive has something to evaluate
          touch pool/pve9/main/test-pve9-universal-config_1.0_all.deb
          touch pool/pve9/main/test-pve9-amd64-config_1.0_amd64.deb
      
      - name: Generate apt-ftparchive
        run: |
          apt-ftparchive generate apt-ftparchive.conf

      - name: Index Debian Trixie Test Packages
        run: |
          apt-ftparchive -c trixie.conf release debian/dists/trixie > debian/dists/trixie/Release

      - name: Index Proxmox VE 9 Test Packages
        run: |
          apt-ftparchive -c pve9.conf release debian/dists/pve9 > debian/dists/pve9/Release

      - name: Output Generated Trixie Release Manifest File for Review
        run: cat dists/trixie/Release

      - name: Output Generated Proxmox VE 9 Release Manifest File for Review
        run: cat dists/pve9/Release

      - name: Archive Test Index Output Tree
        uses: actions/upload-artifact@v4
        with:
          name: test-apt-repository-layout
          path: dists/
