name: TEST REPO INDEXER

on:
  workflow_dispatch:

jobs:
  test-index:
    name: Dry Run apt-ftparchive Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cache Core Bootstrap Packages
        id: cache-bootstrap
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-test-indexer-bootstrap

      - name: Update System Repositories
        run: sudo apt-get update

      - name: Install apt-utils Utilities
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Creating apt-ftparchive Cache Folder
        run: mkdir -p cache 

      - name: Create Trixie dist tree Folders
        run:  mkdir -p dists/trixie/{main,non-free}/{binary-all,binary-amd64,source}

      - name: Create Trixie pool folders
        run: mkdir -p pool/trixie/{main,non-free}
      
      # - name: Create Proxmox VE 9 dist tree Folders
      #   run:  mkdir -p dists/pve9/{main,non-free}/{binary-all,binary-amd64,source}

      # - name: Create Proxmox VE 9 pool folders
      #   run: mkdir -p pool/pve9/{main,non-free}

      # - name: Create Bookworm dist tree Folders
      #   run:  mkdir -p dists/bookworm/{main,non-free}/{binary-all,binary-amd64,source}

      # - name: Create Bookworm pool folders
      #   run: mkdir -p pool/bookworm/{main,non-free}
      
      # - name: Create Proxmox VE 8 dist tree Folders
      #   run:  mkdir -p dists/pve8/{main,non-free}/{binary-all,binary-amd64,source}

      # - name: Create Proxmox VE 8 pool folders
      #   run: mkdir -p pool/pve8/{main,non-free}

      - name: Create Trixie main all Package
        run: |
          export DIST="trixie"
          export SECTION="main"
          export ARCH="all"
          export VERSION="1.0"

          mkdir -p /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN
          cat << EOF > /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN/control
          Package: ${DIST}-${SECTION}-${ARCH}-test
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: curtistinkers
          Description: A ${SECTION} ${ARCH} test package for ${DIST^}.
          EOF
          dpkg-deb --build /tmp/${DIST}-${SECTION}-${ARCH} pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb

      - name: Create Trixie main amd64 Package
        run: |
          export DIST="trixie"
          export SECTION="main"
          export ARCH="amd64"
          export VERSION="2.0"

          mkdir -p /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN
          cat << EOF > /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN/control
          Package: ${DIST}-${SECTION}-${ARCH}-test
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: curtistinkers
          Description: A ${SECTION} ${ARCH} test package for ${DIST^}.
          EOF
          dpkg-deb --build /tmp/${DIST}-${SECTION}-${ARCH} pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb

      - name: Create Trixie non-free all Package
        run: |
          export DIST="trixie"
          export SECTION="non-free"
          export ARCH="all"
          export VERSION="3.0"

          mkdir -p /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN
          cat << EOF > /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN/control
          Package: ${DIST}-${SECTION}-${ARCH}-test
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: curtistinkers
          Description: A ${SECTION} ${ARCH} test package for ${DIST^}.
          EOF
          dpkg-deb --build /tmp/${DIST}-${SECTION}-${ARCH} pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb

      - name: Create Trixie non-free amd64 Package
        run: |
          export DIST="trixie"
          export SECTION="non-free"
          export ARCH="amd64"
          export VERSION="4.0"

          mkdir -p /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN
          cat << EOF > /tmp/${DIST}-${SECTION}-${ARCH}/DEBIAN/control
          Package: ${DIST}-${SECTION}-${ARCH}-test
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: curtistinkers
          Description: A ${SECTION} ${ARCH} test package for ${DIST^}.
          EOF
          dpkg-deb --build /tmp/${DIST}-${SECTION}-${ARCH} pool/${DIST}/${SECTION}/${DIST}-${SECTION}-${ARCH}-test_${VERSION}_${ARCH}.deb
      
      - name: Generate apt-ftparchive
        run: |
          apt-ftparchive generate .github/apt/apt-ftparchive.conf

      - name: Index Debian Trixie Test Packages
        run: |
          apt-ftparchive -c .github/apt/trixie-release.conf release dists/trixie > dists/trixie/Release

      # - name: Index Proxmox VE 9 Test Packages
      #   run: |
      #     apt-ftparchive -c .github/apt/pve9-release.conf release dists/pve9 > dists/pve9/Release

      - name: Output Generated Trixie Release Manifest File for Review
        run: cat dists/trixie/Release

      # - name: Output Generated Proxmox VE 9 Release Manifest File for Review
      #   run: cat dists/pve9/Release

      # - name: Output Generated Bookworm Release Manifest File for Review
      #   run: cat dists/bookworm/Release

      # - name: Output Generated Proxmox VE 8 Release Manifest File for Review
      #   run: cat dists/pve8/Release

      - name: Archive Test Index Output Tree
        uses: actions/upload-artifact@v4
        with:
          name: test-apt-repository-layout
          path: dists/
